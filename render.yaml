services:
  - type: web
    name: vault-game-collection
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
    disk:
      name: vault-data
      mountPath: /app/data
      sizeGB: 1
